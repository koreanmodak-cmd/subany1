<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3일 차 미션</title>
  <style>
    body { background-color: #f3e6ff; text-align: center; font-family: sans-serif; padding-top: 40px; }
    .box-container { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 30px; max-width: 350px; margin-left: auto; margin-right: auto; }
    .box-wrapper { width: 60px; height: 60px; font-size: 50px; cursor: pointer; user-select: none; }
    
    /* 덜덜 떨리는 애니메이션 */
    .shake { animation: shakeAnim 0.15s infinite; pointer-events: none; }
    @keyframes shakeAnim {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(15deg); }
      50% { transform: rotate(-15deg); }
      75% { transform: rotate(15deg); }
      100% { transform: rotate(0deg); }
    }
    
    #message { display: none; background: white; padding: 20px; border-radius: 15px; margin: 30px 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    #failMsg { color: #ff4d4d; margin-top: 20px; font-weight: bold; min-height: 24px; }
  </style>
</head>
<body>
  <h2>바니를 향한 내 마음을 찾아라!</h2>
  <p>5개의 상자 중 하나에만 메시지를 넣었셔</p>
  
  <div class="box-container" id="boxContainer">
    <div class="box-wrapper" id="box1" onclick="openBox(1)">🎁</div>
    <div class="box-wrapper" id="box2" onclick="openBox(2)">🎁</div>
    <div class="box-wrapper" id="box3" onclick="openBox(3)">🎁</div>
    <div class="box-wrapper" id="box4" onclick="openBox(4)">🎁</div>
    <div class="box-wrapper" id="box5" onclick="openBox(5)">🎁</div>
  </div>
  
  <p id="failMsg"></p>
  
  <div id="message">
    <h3>찾았다! 내 마음 💌</h3>
    <p>일주일의 절반을 이겨낸 우아가! 머시따 ㅎㅎ<br>애기야 오늘 하루 열심히 일하느라 진짜 수고했어.<br>힘들어두 하트 보면서 기운 내! 많이 사랑하고 아껴 자갸💖💖 잘쟈 뿅!</p>
  </div>

  <script>
    let isOpening = false; // 중복 클릭 방지

    function openBox(num) {
      if (isOpening) return;
      isOpening = true;
      
      const box = document.getElementById('box' + num);
      const failMsg = document.getElementById('failMsg');
      
      // 메시지 초기화 및 흔들림 애니메이션 시작
      failMsg.innerText = "두근두근...";
      box.classList.add('shake');

      // 1.5초 후 결과 공개
      setTimeout(() => {
        box.classList.remove('shake');
        
        if (num === 3) {
          // 정답 상자 (3번)
          box.innerText = "💖";
          failMsg.innerText = "성공!";
          document.getElementById('message').style.display = 'block';
          document.getElementById('boxContainer').style.pointerEvents = 'none';
        } else {
          // 오답 상자
          box.innerText = "💦";
          failMsg.innerText = "이거 아니지롱 메롱";
          box.style.pointerEvents = 'none'; // 한 번 연 상자는 다시 못 누르게
          isOpening = false;
        }
      }, 1500);
    }
  </script>
</body>
</html>
