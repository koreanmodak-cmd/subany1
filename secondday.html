<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2일 차 미션</title>
  <style>
    body { background-color: #e6f2ff; text-align: center; font-family: sans-serif; padding-top: 50px; }
    .btn { padding: 15px 30px; font-size: 20px; background: #66b3ff; color: white; border: none; border-radius: 10px; margin-top: 20px; }
    #message { display: none; background: white; padding: 20px; border-radius: 15px; margin: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <h2>⏱️ 5.28초를 맞춰라!</h2>
  <p>5초 28에 맞추어서 타이머를 멈춰봐 아가야! 0.02초는 봐줌 ㅎㅎ</p>
  <h1 id="time">0.00</h1>
  <button class="btn" id="actionBtn" onclick="toggleTimer()">시작!</button>
  <p id="resultMsg" style="color: #ff4d4d;"></p>
  <div id="message">
    <h3>대단한데?! 🎉</h3>
    <p>오늘 하루도 고생 많았지?<br>퇴근하고도 타이머 맞추는 집중력 머시쪄 우아가<br>출출하면 야식도 챙겨 먹고, 내일도 화이팅하자 사랑해 어수비! 잘자 뿅 ㅎㅎ</p>
  </div>
  <script>
    let startTime, timerInterval;
    let running = false;
    function toggleTimer() {
      const btn = document.getElementById('actionBtn');
      const timeDisplay = document.getElementById('time');
      const resultMsg = document.getElementById('resultMsg');
      
      if(!running) { // 시작
        startTime = Date.now();
        timerInterval = setInterval(() => {
          timeDisplay.innerText = ((Date.now() - startTime) / 1000).toFixed(2);
        }, 10);
        btn.innerText = "정지!";
        btn.style.background = "#ff4d4d";
        resultMsg.innerText = "";
        running = true;
      } else { // 정지
        clearInterval(timerInterval);
        const finalTime = ((Date.now() - startTime) / 1000).toFixed(2);
        btn.innerText = "다시 도전";
        btn.style.background = "#66b3ff";
        running = false;
        
        // 5.18 ~ 5.38 사이면 성공
        if(finalTime >= 5.26 && finalTime <= 5.30) {
          document.getElementById('message').style.display = 'block';
          btn.style.display = 'none';
          resultMsg.innerText = "성공!";
        } else {
          resultMsg.innerText = "ㄲㅂ! 다시 해봐 ㅎㅎ";
        }
      }
    }
  </script>
</body>
</html>
